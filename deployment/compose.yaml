name: comfyfitter
x-logs: &logs
  driver: json-file
  options: {max-size: "10m", max-file: "3"}
services:
  app:
    build: {context: .., dockerfile: deployment/Dockerfile.app}
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=64m,mode=1777"]
    environment:
      COMFYFITTER_DEPLOYMENT_MODE: hosted
      COMFYFITTER_PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN}
      COMFYFITTER_OIDC_ISSUER: ${OIDC_ISSUER:?Set OIDC_ISSUER}
      COMFYFITTER_OIDC_AUDIENCE: ${OIDC_CLIENT_ID:?Set OIDC_CLIENT_ID}
      COMFYFITTER_OIDC_JWKS_URL: ${OIDC_JWKS_URL:?Set OIDC_JWKS_URL}
      COMFYFITTER_COMFY_URL: http://worker:8188
      COMFYFITTER_DATA_DIR: /data
      COMFYFITTER_COMFY_INPUT_DIR: /srv/comfy/input
      COMFYFITTER_COMFY_OUTPUT_DIR: /srv/comfy/output
      # Hosted GPU qualification is separate from the local Windows benchmark.
      COMFYFITTER_QUALITY_MANIFEST: /app/evaluation/summary_hosted.json
      COMFYFITTER_FEATURE_MANIFEST: /app/evaluation/feature_quality_hosted.json
      COMFYFITTER_QUEUE_CAPACITY: "5"
      COMFYFITTER_DAILY_USER_GENERATIONS: "10"
      COMFYFITTER_DAILY_TOTAL_GENERATIONS: "20"
      COMFYFITTER_REQUESTS_PER_MINUTE: "120"
      COMFYFITTER_RETENTION_SECONDS: "86400"
      COMFYFITTER_SAVED_LOOK_CAPACITY: "20"
      COMFYFITTER_SAVED_LOOK_BYTES: "268435456"
    volumes: ["app-data:/data", "inference-data:/srv/comfy"]
    networks: [inference, application, identity-egress]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=8)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    mem_limit: 1g
    cpus: 2
    pids_limit: 128
    logging: *logs
  worker:
    build: {context: .., dockerfile: deployment/Dockerfile.worker}
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=256m,mode=1777"]
    volumes:
      - inference-data:/srv/comfy
      - type: bind
        source: ${MODEL_DIRECTORY:?Set MODEL_DIRECTORY}
        target: /models
        read_only: true
        bind: {create_host_path: false}
    networks: [inference]
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8188/system_stats',timeout=5)"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 120s
    restart: unless-stopped
    mem_limit: 16g
    cpus: 6
    pids_limit: 512
    logging: *logs
  gateway:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5
    command: ["--config=/etc/oauth2-proxy.cfg"]
    environment:
      OAUTH2_PROXY_OIDC_ISSUER_URL: ${OIDC_ISSUER:?Set OIDC_ISSUER}
      OAUTH2_PROXY_CLIENT_ID: ${OIDC_CLIENT_ID:?Set OIDC_CLIENT_ID}
      OAUTH2_PROXY_REDIRECT_URL: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN}/oauth2/callback
      OAUTH2_PROXY_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAIN:?Set ALLOWED_EMAIL_DOMAIN}
    volumes: ["./oauth2-proxy.cfg:/etc/oauth2-proxy.cfg:ro"]
    secrets: [oidc_client_secret, session_cookie_key]
    networks: [application, edge]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=16m,mode=1777"]
    restart: unless-stopped
    mem_limit: 256m
    cpus: 1
    pids_limit: 64
    logging: *logs
  tls:
    image: nginxinc/nginx-unprivileged:1.30.5-alpine-slim
    command: [nginx, -g, "daemon off;"]
    depends_on:
      gateway: {condition: service_started}
    ports: ["127.0.0.1:8443:8443"]
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - type: bind
        source: ./tls
        target: /etc/nginx/tls
        read_only: true
        bind: {create_host_path: false}
    networks: [edge]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=32m,mode=1777"]
    restart: unless-stopped
    mem_limit: 128m
    cpus: 1
    pids_limit: 64
    logging: *logs
networks:
  inference: {internal: true}
  application: {internal: true}
  identity-egress: {}
  edge: {}
volumes:
  app-data: {}
  inference-data: {}
secrets:
  oidc_client_secret: {file: ./secrets/oidc_client_secret}
  session_cookie_key: {file: ./secrets/session_cookie_key}
