http_address = "0.0.0.0:4180"
provider = "oidc"
upstreams = ["http://app:8000/"]
reverse_proxy = true
pass_host_header = true
pass_authorization_header = true
skip_auth_strip_headers = true
pass_access_token = false
pass_basic_auth = false
pass_user_headers = false
oidc_enabled_signing_algs = ["RS256"]
insecure_oidc_skip_nonce = false
insecure_oidc_skip_issuer_verification = false
insecure_oidc_allow_unverified_email = false
code_challenge_method = "S256"
scope = "openid profile email"
cookie_name = "__Host-comfyfitter"
cookie_secure = true
cookie_httponly = true
cookie_samesite = "lax"
cookie_path = "/"
cookie_expire = "20m"
cookie_refresh = "5m"
cookie_csrf_per_request = true
cookie_csrf_per_request_limit = 5
cookie_csrf_samesite = "lax"
client_secret_file = "/run/secrets/oidc_client_secret"
cookie_secret_file = "/run/secrets/session_cookie_key"
request_logging = false
auth_logging = false
standard_logging = false
silence_ping_logging = true
